name: Release

# GitHub 릴리스를 만들면 Maven Central 에 올린다.
# JitPack 은 여기서 할 일이 없다. 요청받을 때 태그를 스스로 클론해 빌드하기 때문이다.
# 그쪽 확인은 verify-release.yml 이 맡는다.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '배포할 태그 (예: v0.2.0)'
        required: true

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: tag
        run: echo "value=${{ github.event.inputs.tag || github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.value }}

      # 업로드까지 간 다음 거부당하는 것보다 여기서 멈추는 편이 원인을 찾기 쉽다.
      - name: Check the required secrets are present
        env:
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          for name in USERNAME PASSWORD SIGNING_KEY SIGNING_PASSWORD; do
            test -n "${!name}" || { echo "시크릿이 비어 있다: $name"; exit 1; }
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      # Central 은 한 번 올라간 버전을 덮어쓸 수 없다. 올리기 전에 걸러야 한다.
      - name: Check the tag matches the project version
        run: |
          VERSION=$(./gradlew -q properties --property version | awk '/^version:/ {print $2}')
          TAG='${{ steps.tag.outputs.value }}'
          echo "태그: $TAG, build.gradle: $VERSION"
          test "$TAG" = "v$VERSION" \
            || { echo "태그와 build.gradle 의 version 이 다르다"; exit 1; }

      - name: Build
        run: ./gradlew build

      # 올리기만 하고 공개하지 않는다. 포털에서 Publish 를 눌러야 나간다.
      # 절차가 익으면 publishAndReleaseToMavenCentral 로 바꾼다.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral

      # build.gradle 이 조건부로 서명하므로 키가 전달되지 않으면 조용히 서명 없이 지나간다.
      - name: Check the artifacts were signed
        run: |
          COUNT=$(find build -name '*.asc' | wc -l | tr -d ' ')
          echo "서명 파일 $COUNT 개"
          test "$COUNT" -gt 0 || { echo "서명이 붙지 않았다. 서명 키가 전달되지 않았다"; exit 1; }

      - name: Summary
        run: |
          echo "Central Portal 에서 Publish 를 눌러야 공개된다." >> "$GITHUB_STEP_SUMMARY"
          echo "https://central.sonatype.com/publishing/deployments" >> "$GITHUB_STEP_SUMMARY"
