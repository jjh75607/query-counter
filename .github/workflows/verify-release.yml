name: Verify Release

# Publish 를 손으로 누른 뒤에 돌린다. 릴리스 시점에는 아직 공개 전이라 자동 실행이
# 늘 실패한다.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '검증할 태그 (예: v0.2.0)'
        required: true

jobs:
  verify-central:
    name: Verify Maven Central artifact
    runs-on: ubuntu-latest

    steps:
      # Central 의 버전에는 v 가 없다. 태그 v0.2.0 은 0.2.0 이다.
      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REF_TAG: ${{ github.event.inputs.tag }}

      # Central 은 Publish 를 누른 뒤 repo1 로 동기화되기까지 몇 분에서 수십 분 걸린다.
      # 전파 지연을 그냥 404 로 내면 사람이 릴리스가 깨졌다고 읽는다. 0.4.0 에서 Publish
      # 직후에 돌려 실제로 그렇게 됐다. 그래서 기다려 본 다음에 실패시키고, 실패할 때는
      # 무엇을 확인해야 하는지 함께 낸다.
      - name: Download the POM and the jar
        env:
          ATTEMPTS: '30'
          DELAY: '30'
        run: |
          VERSION='${{ steps.version.outputs.value }}'
          BASE="https://repo1.maven.org/maven2/io/github/jjh75607/query-counter/$VERSION"

          fetch() {
            for i in $(seq 1 "$ATTEMPTS"); do
              if curl -sS -f --max-time 60 -o "$2" "$1"; then
                echo "받았다: $(basename "$1") ($i/$ATTEMPTS)"
                return 0
              fi
              if [ "$i" = "$ATTEMPTS" ]; then
                return 1
              fi
              echo "아직 없다: $(basename "$1"). ${DELAY}초 뒤에 다시 본다 ($i/$ATTEMPTS)"
              sleep "$DELAY"
            done
          }

          if ! fetch "$BASE/query-counter-$VERSION.pom" pom.xml; then
            echo "" >&2
            echo "$((ATTEMPTS * DELAY))초를 기다렸는데 $VERSION 이 repo1 에 없다. 셋을 확인한다." >&2
            echo "" >&2
            echo "  1. Central 포털에서 Publish 를 눌렀는가. 누르기 전에는 올라가 있어도 나가지 않는다" >&2
            echo "  2. 눌렀다면 그 배포가 PUBLISHED 인가. 아직 처리 중이면 조금 뒤에 이것을 다시 돌린다" >&2
            echo "  3. 둘 다 맞는데 없으면 좌표나 버전을 확인한다" >&2
            echo "" >&2
            echo "  https://central.sonatype.com/publishing/deployments" >&2
            exit 1
          fi

          fetch "$BASE/query-counter-$VERSION.jar" library.jar || exit 1
          test -s library.jar || { echo "jar 가 비어 있다"; exit 1; }

      - name: Check POM coordinates
        run: |
          VERSION='${{ steps.version.outputs.value }}'
          grep -q "<groupId>io.github.jjh75607</groupId>" pom.xml \
            || { echo "groupId 가 io.github.jjh75607 이 아니다"; cat pom.xml; exit 1; }
          grep -q "<artifactId>query-counter</artifactId>" pom.xml \
            || { echo "artifactId 가 query-counter 가 아니다"; cat pom.xml; exit 1; }
          grep -q "<version>$VERSION</version>" pom.xml \
            || { echo "version 이 $VERSION 이 아니다"; cat pom.xml; exit 1; }

      # 자동 설정과 리스너 등록 파일이 빠지면 라이브러리가 조용히 아무것도 하지 않는다.
      - name: Check the jar contains the wiring files
        run: |
          unzip -l library.jar > listing.txt
          for entry in \
            "META-INF/spring.factories" \
            "META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports" \
            "META-INF/spring-configuration-metadata.json"
          do
            grep -q "$entry" listing.txt || { echo "빠짐: $entry"; cat listing.txt; exit 1; }
          done

      - name: Check the signature, sources and javadoc are published
        run: |
          VERSION='${{ steps.version.outputs.value }}'
          BASE="https://repo1.maven.org/maven2/io/github/jjh75607/query-counter/$VERSION"
          for suffix in ".jar.asc" "-sources.jar" "-javadoc.jar"; do
            curl -sS -f --max-time 120 -o /dev/null \
              "$BASE/query-counter-$VERSION$suffix" \
              || { echo "빠짐: query-counter-$VERSION$suffix"; exit 1; }
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 위 검사는 파일이 있는지만 본다. 0.2.0 은 그 검사를 다 통과하고도 설치가
      # 안 됐다. 이슈 #98 이다.
      - name: Resolve it as a consumer would
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p consumer
          echo "rootProject.name = 'consumer-check'" > consumer/settings.gradle
          printf '%s\n' \
            "plugins { id 'java' }" \
            "repositories { mavenCentral() }" \
            "dependencies { testImplementation 'io.github.jjh75607:query-counter:${VERSION}' }" \
            "tasks.register('resolve') { doLast { configurations.testRuntimeClasspath.files.each { println it.name } } }" \
            > consumer/build.gradle
          gradle --no-daemon -q -p consumer resolve
