import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java-library'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.vanniktech.maven.publish' version '0.37.0'
    id 'com.diffplug.spotless' version '8.9.0'
}

// com.github.* 는 Central 네임스페이스를 받을 수 없다. JitPack 은 이 값을 무시한다.
group = 'io.github.jjh75607'
version = '0.2.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    // withSourcesJar 와 withJavadocJar 를 여기 두지 않는다. 배포 플러그인이 만드는 것과
    // 파일 이름이 겹쳐 publishToMavenLocal 이 실패한다.
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// CI 에서 -PspringBootVersion 으로 지원 범위를 검증한다. 지정하지 않으면 플러그인 기본값을 쓴다.
def springBootVersion = findProperty('springBootVersion')

dependencyManagement {
    imports {
        if (springBootVersion) {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        }
        else {
            mavenBom SpringBootPlugin.BOM_COORDINATES
        }
    }
}

// 지금 스타일을 고정하는 것이 목적이다. 재포맷하지 않는다.
// spring-javaformat 은 들여쓰기가 탭이라 저장소 전체가 바뀌므로 쓰지 않는다.
// import 순서는 이미 일관적이라 규칙을 걸지 않는다. 필요해지면 그때 추가한다.
spotless {
    java {
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        leadingTabsToSpaces(4)
    }
}

wrapper {
    gradleVersion = "8.13"
    distributionType = Wrapper.DistributionType.ALL
}

mavenPublishing {
    publishToMavenCentral()

    // 조건을 걷어내면 JitPack 이 죽는다. signAllPublications 는 정식 버전에서 서명을 필수로
    // 만드는데 JitPack 빌드 머신에는 GPG 키가 없다.
    if (providers.gradleProperty('signingInMemoryKey').present) {
        signAllPublications()
    }

    pom {
        name = 'query-counter'
        description = 'A test library for asserting how many queries a Spring test executes, and how long they take.'
        inceptionYear = '2025'
        url = 'https://github.com/jjh75607/query-counter'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'jjh75607'
                name = 'jjh75607'
                url = 'https://github.com/jjh75607'
            }
        }
        scm {
            url = 'https://github.com/jjh75607/query-counter'
            connection = 'scm:git:git://github.com/jjh75607/query-counter.git'
            developerConnection = 'scm:git:ssh://git@github.com/jjh75607/query-counter.git'
        }
    }
}

// 배포 태스크에만 물려 있어서 붙인다. 없으면 javadoc 이 깨져도 릴리스 때까지 모른다.
tasks.named('assemble') {
    dependsOn 'sourcesJar', 'plainJavadocJar'
}

dependencies {
    // junit
    api 'org.junit.jupiter:junit-jupiter-api'

    // Spring
    implementation 'org.springframework.boot:spring-boot-starter'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Spring TestContext. TestExecutionListener 등록에 필요하다.
    // 이 라이브러리를 쓰는 쪽은 이미 테스트 클래스패스에 갖고 있다.
    api 'org.springframework:spring-test'

    // datasource-proxy
    implementation 'net.ttddyy:datasource-proxy:1.10.1'

    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    testImplementation 'com.h2database:h2'

    // example 패키지의 JPA 예제용. testImplementation 이라 소비자에게 전이되지 않는다.
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'

}

bootJar {
    enabled = false
}

jar {
    enabled = true
    archiveClassifier = ''
}

tasks.named('test') {
    useJUnitPlatform()
}
